modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
issueTrackerURL="https://example.com/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},1.21)"
    ordering="NONE"
    side="BOTH"

# Mandatory: the inventory screen surfaces whatever Curios slots are registered for the
# player by any installed mod (mask, backpack, uniform, etc). This mod no longer defines
# its own slot types - it just displays what Curios already knows about.
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[5.0,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependency: corpse looting. Ragdollified 1.0.0-RELEASE split its player-corpse
# feature out of the core mod into a separate addon, "Ragdollified Player Corpse"
# (modid ragdollifiedpc) - so that, not "ragdollified", is what owns the corpse menu now.
# When it's installed, CorpseOpenRedirect replaces its looting screen with the merged
# Tarkov view. Loading AFTER it keeps our redirect behind its own registration. The
# redirect still recognises the pre-split core class name, so old packs keep working.
[[dependencies.${mod_id}]]
    modId="ragdollifiedpc"
    mandatory=false
    versionRange="[0.1.0-BETA,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependency: First Aid. When present it owns the player's real health as a per-limb
# damage model, and vanilla health becomes only a derived summary of it - so the HUD reads
# the limbs directly via FirstAidCompat. Loading AFTER it keeps its capability registered
# before we ever look it up.
[[dependencies.${mod_id}]]
    modId="firstaid"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependency: loads fine with or without Thirst Was Taken installed.
# If present, the mod reads its thirst value via reflection for the HUD's water gauge.
# (Note: the mod's actual id is "thirst" - the jar is just named ThirstWasTaken-*.jar.)
[[dependencies.${mod_id}]]
    modId="thirst"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="CLIENT"

# Soft dependency: tarkovdayz (Zcraft-Items). It supplies the rouble notes the wallet is
# denominated in, most of what the trader stocks, and the desktop PC and laptop the market's
# default access config points at. Nothing here is a hard reference - if the mod is absent,
# those price entries drop out of the catalogue and the terminal ids never match anything.
[[dependencies.${mod_id}]]
    modId="tarkovdayz"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependency: TACZ. Guns and ammo are priced from their own ballistics, so the shop
# follows whatever gun pack is installed. Reached entirely by reflection (TaczMarketCompat)
# rather than a compile-time dependency, deliberately: a hard dependency would pin this mod
# to one TACZ version.
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependency: TaCZ Magazines. Empty magazines are stocked and priced by capacity.
# Reflective, like every other integration here.
[[dependencies.${mod_id}]]
    modId="taczmagazines"
    mandatory=false
    versionRange="[0.1,)"
    ordering="AFTER"
    side="BOTH"

